<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal Smart Beauty Advisor</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">

      <!-- Header -->
      <header class="site-header">
        <img src="loreal-logo.png" alt="L'Oréal Logo" class="logo" />
        <h1 class="site-title">Smart Routine & Product Advisor</h1>
        <p class="site-subtitle">Powered by AI • Personalized for You</p>
      </header>

      <!-- Chat Area -->
      <main>
        <section class="chatbox">
          <div id="chatWindow" class="chat-window"></div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about skincare, haircare, or makeup…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>

        <!-- Quick suggestions -->
        <div class="suggestions">
          <p class="suggestions-label">Try asking:</p>
          <div class="suggestion-chips">
            <button class="chip" onclick="askQuestion('What moisturizer is best for dry skin?')">Best moisturizer for dry skin</button>
            <button class="chip" onclick="askQuestion('Recommend a L\'Oréal mascara for volume')">Best L'Oréal mascara</button>
            <button class="chip" onclick="askQuestion('How do I build a skincare routine?')">Build a skincare routine</button>
            <button class="chip" onclick="askQuestion('What hair products help with frizz?')">Frizz control products</button>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <a href="https://www.loreal.com/en/privacy-policy/" target="_blank">Privacy Policy</a>
          <a href="https://www.loreal.com/en/terms-and-conditions/" target="_blank">Terms of Use</a>
          <a href="https://www.loreal.com/en/contact-us/" target="_blank">Contact</a>
        </nav>
      </footer>

    </div>

    <script src="script.js"></script>
    <script>
      function askQuestion(question) {
        document.getElementById('userInput').value = question;
        document.getElementById('chatForm').dispatchEvent(new Event('submit'));
      }
    </script>
  </body>
</html>
